# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: conduit

before:
  hooks:
    - go mod tidy

builds:
  - id: conduit
    main: ./main.go
    binary: conduit
    env:
      - CGO_ENABLED=0
    targets:
      # Start with the most common GOOS/GOARCH pairs; we can always add more.
      - darwin_amd64
      - darwin_arm64
      - freebsd_amd64
      - freebsd_arm64
      - openbsd_amd64
      - linux_amd64
      - linux_arm_v7
      - linux_arm64
      - linux_mips64
      - windows_amd64
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: die-net
    name: conduit
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## conduit {{ .Tag }}

    Protocol-converting proxy service.
  footer: |
    **Full Changelog**: https://github.com/die-net/conduit/compare/{{ .PreviousTag }}...{{ .Tag }}
